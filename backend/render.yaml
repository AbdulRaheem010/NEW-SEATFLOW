services:
  - type: web
    name: seatflow-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: seatflow-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"

databases:
  - name: seatflow-db
    plan: free
