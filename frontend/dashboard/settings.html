<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Settings — SeatFlow</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"><link rel="stylesheet" href="../css/dashboard.css"></head>
<body><div class="app-shell"><div class="sidebar-overlay" data-sidebar-overlay></div><aside class="app-sidebar"><a href="../index.html" class="brand"><span class="brand-mark"></span>SeatFlow</a><nav class="sidebar-nav"><a href="index.html" class="sidebar-link"><span class="dot"></span>Overview</a><div class="sidebar-group"><p class="sidebar-group-label">Events</p><a href="events.html" class="sidebar-link"><span class="dot"></span>All Events</a><a href="create-event.html" class="sidebar-link"><span class="dot"></span>Create Event</a></div><div class="sidebar-group"><p class="sidebar-group-label">Workspace</p><a href="templates.html" class="sidebar-link"><span class="dot"></span>Templates</a><a href="analytics.html" class="sidebar-link"><span class="dot"></span>Analytics</a><a href="billing.html" class="sidebar-link"><span class="dot"></span>Billing</a></div><div class="sidebar-group"><p class="sidebar-group-label">Account</p><a href="settings.html" class="sidebar-link active"><span class="dot"></span>Settings</a><a href="index.html" class="sidebar-link dashboard-home-link"><span class="dot"></span>Dashboard</a>
        <a href="../faq.html" class="sidebar-link"><span class="dot"></span>Help</a></div></nav><div class="sidebar-footer"><div class="sidebar-user-avatar" data-user-initial>U</div><div class="sidebar-user-meta"><strong data-user-name>Organizer</strong><span data-user-plan>Free plan</span></div><button class="sidebar-logout" data-logout>Log out</button></div></aside><main class="app-main"><header class="app-topbar"><div style="display:flex;align-items:center;gap:14px;"><button class="sidebar-toggle-mobile" data-sidebar-toggle aria-label="Toggle menu" aria-expanded="false" type="button">&#9776;</button><h1>Settings</h1></header><div class="app-content"><div class="dash-panel"><h3>Profile</h3><div class="form-status" data-settings-status role="alert"></div><form data-settings-form novalidate><div class="grid-2" style="margin-top:18px;"><div class="form-field"><label for="settingFirst">First name</label><input id="settingFirst" type="text" autocomplete="given-name"><p class="form-error"></p></div><div class="form-field"><label for="settingLast">Last name</label><input id="settingLast" type="text" autocomplete="family-name"><p class="form-error"></p></div><div><p class="stat-label">Email</p><p data-setting-email>—</p></div><div><p class="stat-label">Plan</p><p data-setting-plan>Free</p></div></div><button class="btn btn-primary btn-sm" type="submit">Save profile</button></form></div><div class="dash-panel"><h3>Account security</h3><p>Your account is protected by your SeatFlow login credentials.</p><a href="../forgot-password.html" class="btn btn-ghost btn-sm">Reset password</a></div></div></main></div><script type="module">
import {requireAuth} from '../js/auth.js'; import {getCurrentUser,setCurrentUser,logoutUser} from '../js/state.js'; import {apiRequest} from '../js/api.js';
document.addEventListener('DOMContentLoaded',()=>{requireAuth();const u=getCurrentUser()||{};document.querySelector('#settingFirst').value=u.firstName||'';document.querySelector('#settingLast').value=u.lastName||'';document.querySelector('[data-setting-email]').textContent=u.email||'';document.querySelector('[data-setting-plan]').textContent=u.plan||'Free';document.querySelectorAll('[data-user-plan]').forEach(e=>e.textContent=(u.plan||'Free')+' plan');document.querySelectorAll('[data-user-name]').forEach(e=>e.textContent=[u.firstName,u.lastName].filter(Boolean).join(' ')||'Organizer');document.querySelectorAll('[data-user-initial]').forEach(e=>e.textContent=(u.firstName||'U').charAt(0).toUpperCase());document.querySelector('[data-settings-form]').addEventListener('submit',async(e)=>{e.preventDefault();const first=document.querySelector('#settingFirst'),last=document.querySelector('#settingLast'),status=document.querySelector('[data-settings-status]');if(!first.value.trim()||!last.value.trim()){status.textContent='First name and last name are required.';status.className='form-status error';return}const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Saving…';try{const result=await apiRequest('/auth/me',{method:'PATCH',body:JSON.stringify({firstName:first.value.trim(),lastName:last.value.trim()})});setCurrentUser(result.user);status.textContent='Profile saved successfully.';status.className='form-status success';document.querySelector('[data-user-name]').textContent=result.user.firstName+' '+result.user.lastName;document.querySelector('[data-user-initial]').textContent=result.user.firstName.charAt(0).toUpperCase();}catch(err){status.textContent=err.message||'Unable to save profile.';status.className='form-status error';}finally{btn.disabled=false;btn.textContent='Save profile';}});document.querySelectorAll('[data-logout]').forEach(b=>b.onclick=()=>{logoutUser();localStorage.removeItem('seatflow_token');location.href='../login.html'});});
</script><script type="module" src="../js/dashboard.js"></script>
</body></html>
