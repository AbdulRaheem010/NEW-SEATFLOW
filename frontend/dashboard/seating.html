<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seating — SeatFlow</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/seating.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-overlay" data-sidebar-overlay></div>

  <aside class="app-sidebar">
    <a href="../index.html" class="brand"><span class="brand-mark"></span>SeatFlow</a>
    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-link"><span class="dot"></span>Overview</a>
      <div class="sidebar-group">
        <p class="sidebar-group-label">Events</p>
        <a href="events.html" class="sidebar-link"><span class="dot"></span>All Events</a>
        <a href="create-event.html" class="sidebar-link"><span class="dot"></span>Create Event</a>
      </div>
      <div class="sidebar-group">
        <p class="sidebar-group-label">This event</p>
        <a href="guests.html" class="sidebar-link"><span class="dot"></span>Guests</a>
        <a href="tables.html" class="sidebar-link"><span class="dot"></span>Tables</a>
        <a href="seating.html" class="sidebar-link active"><span class="dot"></span>Seating</a>
      </div>
      <div class="sidebar-group">
        <p class="sidebar-group-label">Workspace</p>
        <a href="templates.html" class="sidebar-link"><span class="dot"></span>Templates</a>
        <a href="analytics.html" class="sidebar-link"><span class="dot"></span>Analytics</a>
        <a href="billing.html" class="sidebar-link"><span class="dot"></span>Billing</a>
      </div>
      <div class="sidebar-group">
        <p class="sidebar-group-label">Account</p>
        <a href="settings.html" class="sidebar-link"><span class="dot"></span>Settings</a>
        <a href="../faq.html" class="sidebar-link"><span class="dot"></span>Help</a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user-avatar" data-user-initial>U</div>
      <div class="sidebar-user-meta"><strong data-user-name>Organizer</strong><span>Standard plan</span></div>
      <button class="sidebar-logout" data-logout>Log out</button>
    </div>
  </aside>

  <div class="app-main">
    <header class="app-topbar">
      <div style="display:flex; align-items:center; gap:14px;">
        <button class="sidebar-toggle-mobile" data-sidebar-toggle aria-label="Toggle menu"><span></span><span></span><span></span></button>
        <h1>Seating</h1>
      </div>
      <div class="topbar-actions">
        <a href="tables.html" class="btn btn-ghost btn-sm">Manage Tables</a>
      </div>
    </header>

    <div class="seating-shell">

      <!-- Guest pool -->
      <div class="seating-pane">
        <div class="seating-pane-head">
          <h4>Guests</h4>
          <input type="search" class="guest-pool-search" placeholder="Search\u2026" data-pool-search>
          <div class="guest-pool-filters">
            <button type="button" class="active" data-pool-filter="all">All</button>
            <button type="button" data-pool-filter="unassigned">Unassigned</button>
            <button type="button" data-pool-filter="assigned">Assigned</button>
            <button type="button" data-pool-filter="vip">VIP</button>
          </div>
        </div>
        <div class="guest-pool-list" data-pool-list></div>
      </div>

      <!-- Canvas -->
      <div class="seating-pane" style="border-right:1px solid var(--border); padding:0;">
        <div class="seating-toolbar">
          <button class="icon-btn" data-zoom-out title="Zoom out">\u2212</button>
          <button class="icon-btn" data-zoom-in title="Zoom in">+</button>
          <button class="icon-btn" data-zoom-reset title="Reset view">\u25a2</button>
          <span class="spacer"></span>
          <button class="icon-btn" data-undo title="Undo">\u21b6</button>
          <button class="icon-btn" data-redo title="Redo">\u21b7</button>
          <button class="btn btn-ghost btn-sm" data-auto-arrange>Auto Arrange</button>
          <button class="btn btn-primary btn-sm" data-save-layout>Save</button>
        </div>
        <div class="seating-canvas-wrap">
          <div class="seating-canvas" data-seating-canvas></div>
        </div>
      </div>

      <!-- Table details -->
      <div class="seating-pane">
        <div class="seating-pane-head"><h4>Table details</h4></div>
        <div class="detail-panel-body" data-detail-body></div>
      </div>

    </div>
  </div>
</div>

<script type="module" src="../js/dashboard.js"></script>
<script type="module" src="../js/seating.js"></script>
</body>
</html>
