<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tables — SeatFlow</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/seating.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-overlay" data-sidebar-overlay></div>

  <aside class="app-sidebar">
    <a href="index.html" class="brand"><span class="brand-mark"></span>SeatFlow</a>
    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-link"><span class="dot"></span>Overview</a>
      <div class="sidebar-group">
        <p class="sidebar-group-label">Events</p>
        <a href="events.html" class="sidebar-link"><span class="dot"></span>All Events</a>
        <a href="create-event.html" class="sidebar-link"><span class="dot"></span>Create Event</a>
      </div>
      <div class="sidebar-group">
        <p class="sidebar-group-label">This event</p>
        <a href="guests.html" class="sidebar-link"><span class="dot"></span>Guests</a>
        <a href="tables.html" class="sidebar-link active"><span class="dot"></span>Tables</a>
        <a href="seating.html" class="sidebar-link"><span class="dot"></span>Seating</a>
      </div>
      <div class="sidebar-group">
        <p class="sidebar-group-label">Workspace</p>
        <a href="templates.html" class="sidebar-link"><span class="dot"></span>Templates</a>
        <a href="analytics.html" class="sidebar-link"><span class="dot"></span>Analytics</a>
        <a href="billing.html" class="sidebar-link"><span class="dot"></span>Billing</a>
      </div>
      <div class="sidebar-group">
        <p class="sidebar-group-label">Account</p>
        <a href="settings.html" class="sidebar-link"><span class="dot"></span>Settings</a>
        <a href="../faq.html" class="sidebar-link"><span class="dot"></span>Help</a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user-avatar" data-user-initial>U</div>
      <div class="sidebar-user-meta"><strong data-user-name>Organizer</strong><span data-user-plan>Free plan</span></div>
      <button class="sidebar-logout" data-logout>Log out</button>
    </div>
  </aside>

  <div class="app-main">
    <header class="app-topbar">
      <div style="display:flex; align-items:center; gap:14px;">
        <button class="sidebar-toggle-mobile" data-sidebar-toggle aria-label="Toggle menu" aria-expanded="false" type="button">&#9776;</button>
        <h1>Tables</h1>
      </div>
      <div class="topbar-actions">
        <a href="seating.html" class="btn btn-ghost btn-sm">Open Seating Builder</a>
        <button class="btn btn-primary btn-sm" data-add-table>Add Table</button>
      </div>
    </header>

    <div class="app-content">
      <div class="table-manage-grid" data-table-grid></div>

      <div class="empty-state" data-tables-empty style="display:none;">
        <h3>No tables yet.</h3>
        <p>Add your first table, then seat guests from the seating builder.</p>
        <div class="empty-actions">
          <button class="btn btn-primary" data-add-table>Add Table</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" data-table-modal>
  <div class="modal-box">
    <h3 data-table-modal-title>Add Table</h3>
    <form data-table-form novalidate>
      <div class="form-field">
        <label for="tableName">Table name</label>
        <input type="text" id="tableName">
        <p class="form-error"></p>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label for="tableCapacity">Capacity</label>
          <input type="number" id="tableCapacity" min="1" max="24" value="8">
          <p class="form-error"></p>
        </div>
        <div class="form-field">
          <label for="tableShape">Shape</label>
          <select id="tableShape">
            <option value="round">Round</option>
            <option value="rectangle">Rectangle</option>
            <option value="square">Square</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-modal-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Save Table</button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="../js/dashboard.js"></script>
<script type="module" src="../js/tables.js"></script>
</body>
</html>
