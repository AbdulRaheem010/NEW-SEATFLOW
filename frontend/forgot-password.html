<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — SeatFlow</title>
<meta name="description" content="Reset the password for your SeatFlow account.">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-side">
    <a href="index.html" class="brand"><span class="brand-mark"></span>SeatFlow</a>
    <blockquote>
      &ldquo;The optimizer caught two seating conflicts we would have missed entirely.&rdquo;
      <cite>Priya S., Conference organizer</cite>
    </blockquote>
  </div>
  <div class="auth-form-wrap">
    <div class="auth-card">
      <h1>Reset your password</h1>
      <p class="lead">Enter your email and we&rsquo;ll send you a reset link.</p>

      <div class="form-status" role="alert"></div>

      <form data-forgot-form novalidate>
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com">
          <p class="form-error"></p>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
      </form>

      <p class="auth-switch"><a href="login.html">Back to log in</a></p>
    </div>
  </div>
</div>

<script type="module" src="js/auth.js"></script>
</body>
</html>
