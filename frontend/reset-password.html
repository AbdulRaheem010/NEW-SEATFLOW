<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Choose a new password — SeatFlow</title><meta name="description" content="Choose a new SeatFlow password."><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/dashboard.css"></head>
<body><div class="auth-shell"><div class="auth-side"><a href="index.html" class="brand"><span class="brand-mark"></span>SeatFlow</a><div class="auth-promo"><span class="section-kicker">Secure recovery</span><h2>Choose a new password.</h2><p>Your reset link is valid for one hour and can only be used once.</p></div></div><div class="auth-form-wrap"><div class="auth-card"><h1>Choose a new password</h1><p class="lead">Enter and confirm your new SeatFlow password.</p><div class="form-status" role="alert"></div><form data-reset-form novalidate><div class="form-field"><label for="password">New password</label><div class="password-field"><input type="password" id="password" autocomplete="new-password" placeholder="At least 8 characters"><button type="button" class="password-toggle">Show</button></div><p class="form-error"></p></div><div class="form-field"><label for="confirmPassword">Confirm password</label><div class="password-field"><input type="password" id="confirmPassword" autocomplete="new-password"><button type="button" class="password-toggle">Show</button></div><p class="form-error"></p></div><button type="submit" class="btn btn-primary btn-block">Reset password</button></form><p class="auth-switch"><a href="login.html">Back to log in</a></p></div></div></div><script type="module" src="js/auth.js"></script></body></html>
