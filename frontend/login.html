<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — SeatFlow</title>
<meta name="description" content="Log in to your SeatFlow organizer account.">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-side">
    <a href="index.html" class="brand"><span class="brand-mark"></span>SeatFlow</a>
    <blockquote>
      &ldquo;No line at the door for the first time in three weddings we&rsquo;ve planned this year.&rdquo;
      <cite>Naomi R., Wedding planner</cite>
    </blockquote>
  </div>
  <div class="auth-form-wrap">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="lead">Log in to manage your events.</p>

      <div class="form-status" role="alert"></div>

      <form data-login-form novalidate>
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com">
          <p class="form-error"></p>
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <div class="password-field">
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password">
            <button type="button" class="password-toggle">Show</button>
          </div>
          <p class="form-error"></p>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
          <label class="checkbox-row"><input type="checkbox" name="remember"> Remember me</label>
          <a href="forgot-password.html" style="font-size:0.88rem; color:var(--emerald); font-weight:600;">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>

      <p class="auth-switch">Don&rsquo;t have an account? <a href="register.html">Create one</a></p>
    </div>
  </div>
</div>

<script type="module" src="js/auth.js"></script>
</body>
</html>
